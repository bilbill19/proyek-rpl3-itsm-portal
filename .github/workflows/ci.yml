name: CI

on:
  push:
    branches: [main, fix/security-dependencies]
  pull_request:
    branches: [main, fix/security-dependencies]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Placeholder DB connection – replace with actual secret in CI
      DATABASE_URL: "postgresql://username:password@localhost:5432/itsm_db"
      # Any other env vars required by the app (e.g., JWT secret) can be set here as placeholders
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # Prisma: generate client (no migration or DB calls)
      - name: Prisma generate
        run: npx prisma generate

      - name: Run unit tests (Vitest)
        run: npm test

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
